# Browser extension packages
# --------------------------
# Push a tag `ext-vX.Y.Z` (matching extension/manifest.json "version"), or run
# manually. Checks the translations, builds the Chrome / Edge and Firefox copies
# from the same source (extension/scripts/build.mjs: only manifest.json differs),
# lints the Firefox copy with web-ext (must have 0 errors) and produces two zips:
#   pget-extension-chrome-X.Y.Z.zip  -> Chrome Web Store / Edge Add-ons
#   pget-extension-firefox-X.Y.Z.zip -> addons.mozilla.org (AMO_LISTING.md)
# Upload is done by hand for now. Dev-only files (scripts/, *.md) are excluded.

name: Extension

on:
  push:
    tags: ['ext-v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  WEB_EXT_VERSION: 10.8.0

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check translations (_locales)
        run: node extension/scripts/check-i18n.mjs

      - name: Read version
        id: v
        run: |
          v=$(node -p "require('./extension/manifest.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "ext-v$v" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match manifest version $v"; exit 1
          fi

      - name: Build (chrome + firefox)
        run: node extension/scripts/build.mjs chrome firefox

      - name: Lint Firefox build (web-ext)
        run: |
          # Exits non-zero on any error; warnings are printed but allowed.
          npx --yes "web-ext@${WEB_EXT_VERSION}" lint \
            --source-dir dist/extension/firefox --no-config-discovery

      - name: Zip
        run: |
          v='${{ steps.v.outputs.version }}'
          for target in chrome firefox; do
            (cd "dist/extension/$target" && zip -r -X "../../pget-extension-$target-$v.zip" .)
            unzip -l "dist/pget-extension-$target-$v.zip"
          done
          sha256sum dist/*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: pget-extension-${{ steps.v.outputs.version }}
          path: dist/pget-extension-*.zip
          if-no-files-found: error

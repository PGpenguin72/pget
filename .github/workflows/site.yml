# Website (https://pget.pg72.tw)
# ------------------------------
# On push to main that touches site/**: build, then deploy to Cloudflare Workers
# with `wrangler deploy` (config: site/wrangler.jsonc).
#
# Required secret (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN  - create at https://dash.cloudflare.com/profile/api-tokens
#     using the "Edit Cloudflare Workers" template, or a custom token with:
#       Account - Workers Scripts: Edit
#       Account - Account Settings: Read
#       Zone    - Workers Routes: Edit   (zone pg72.tw; needed for the custom domain/route)
#       User    - User Details: Read     (lets wrangler identify the account)
# Optional:
#   CLOUDFLARE_ACCOUNT_ID (secret or variable) - only if the token can see more
#     than one account and wrangler.jsonc doesn't set account_id.
# Without CLOUDFLARE_API_TOKEN the build still runs and the deploy step is skipped.

name: Site

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy

      - name: Deploy skipped
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set; built the site but skipped deploy."

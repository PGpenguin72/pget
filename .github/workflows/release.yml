# App release
# -----------
# Push a tag `vX.Y.Z` (matching app/package.json "version") to build installers
# for Windows / macOS / Linux and attach them, with SHA256SUMS, to a DRAFT
# GitHub Release. Review the draft, then press "Publish".
#
# Engines: scripts/fetch-engines.mjs downloads aria2c + yt-dlp into app/bin/<os>-<arch>/.
# On macOS / Linux it takes aria2 from our own patched build (see aria2.yml),
# selected by the repo variable ARIA2_RELEASE (default below). Env passed to it:
#   ARIA2_URL          tarball for the runner's native platform
#   ARIA2_URL_X64      tarball for x64   (macOS builds both architectures)
#   ARIA2_URL_ARM64    tarball for arm64
#   ARIA2_SHA256SUMS_URL  SHA256SUMS of that aria2 release, for verification
#
# Code signing: off unless the repo variable SIGNING_ENABLED=true. Secrets:
#   macOS (Developer ID + notarization, so Gatekeeper doesn't say "unidentified developer"):
#     CSC_LINK                     base64 of the "Developer ID Application" .p12 (cert + private key)
#     CSC_KEY_PASSWORD             password of that .p12
#     APPLE_ID                     Apple ID email of the developer account
#     APPLE_APP_SPECIFIC_PASSWORD  app-specific password from account.apple.com
#     APPLE_TEAM_ID                10-character Team ID
#   Windows (optional, independent of macOS): WIN_CSC_LINK (base64 .pfx), WIN_CSC_KEY_PASSWORD
# electron-builder signs PGet.app (incl. aria2c / yt-dlp in Resources/bin) with Hardened
# Runtime + app/build/entitlements.mac.plist, notarizes it and staples the ticket.
# Without secrets the builds are unsigned and trigger SmartScreen / Gatekeeper warnings.

name: Release app

on:
  push:
    tags: ['v*']
  workflow_dispatch:   # dry run: builds and uploads workflow artifacts, no release

permissions:
  contents: read

env:
  ARIA2_RELEASE: ${{ vars.ARIA2_RELEASE || 'aria2-1.37.0-pget.1' }}

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            runner: windows-latest
            native: ''               # Windows uses myfreeer's prebuilt aria2 (fetch-engines default)
          - name: macos
            runner: macos-15         # arm64 runner; electron-builder builds x64 + arm64 (see app/package.json)
            native: macos-arm64
          - name: linux
            runner: ubuntu-24.04
            native: linux-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Check tag matches app version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          v=$(node -p "require('./app/package.json').version")
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match app/package.json version $v"; exit 1
          fi

      - name: Engine URLs
        if: matrix.name != 'windows'
        shell: bash
        run: |
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${ARIA2_RELEASE}"
          os=${{ matrix.name }}
          {
            echo "ARIA2_URL=${base}/aria2c-${{ matrix.native }}.tar.gz"
            echo "ARIA2_URL_X64=${base}/aria2c-${os}-x64.tar.gz"
            echo "ARIA2_URL_ARM64=${base}/aria2c-${os}-arm64.tar.gz"
            echo "ARIA2_SHA256SUMS_URL=${base}/SHA256SUMS"
          } >> "$GITHUB_ENV"

      - name: Fetch engines (aria2c, yt-dlp)
        run: node scripts/fetch-engines.mjs

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build installers
        working-directory: app
        shell: bash
        env:
          # --- Code signing (off unless vars.SIGNING_ENABLED == 'true') ---
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ vars.SIGNING_ENABLED == 'true' && 'true' || 'false' }}
          CSC_LINK: ${{ vars.SIGNING_ENABLED == 'true' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ vars.SIGNING_ENABLED == 'true' && secrets.CSC_KEY_PASSWORD || '' }}
          WIN_CSC_LINK: ${{ vars.SIGNING_ENABLED == 'true' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ vars.SIGNING_ENABLED == 'true' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ vars.SIGNING_ENABLED == 'true' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ vars.SIGNING_ENABLED == 'true' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ vars.SIGNING_ENABLED == 'true' && secrets.APPLE_TEAM_ID || '' }}
        # electron-builder 會把「空字串」的 CSC_LINK 當成路徑去讀（macOS 報 "app not a file"），
        # 所以沒設定的簽章變數要整個 unset，不能留空。
        run: |
          # CSC_LINK 是 Apple 的 Developer ID，不能拿去簽 Windows（沒有 WIN_CSC_LINK 時 electron-builder 會退回用 CSC_LINK）
          if [ "$RUNNER_OS" = "Windows" ]; then unset CSC_LINK CSC_KEY_PASSWORD; fi
          for v in CSC_LINK CSC_KEY_PASSWORD WIN_CSC_LINK WIN_CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v:-}" ]; then unset "$v"; fi
          done
          npx electron-builder --publish never

      - name: Verify macOS signature & notarization
        if: matrix.name == 'macos' && vars.SIGNING_ENABLED == 'true'
        working-directory: app/dist
        run: |
          for app in mac*/PGet.app; do
            echo "== $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            # stapler 會連 Apple 的 CloudKit，偶爾網路斷線（Error 68），重試幾次
            for i in 1 2 3 4 5; do xcrun stapler validate "$app" && break; [ $i = 5 ] && exit 1; sleep 15; done
            spctl --assess --type execute --verbose=4 "$app"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          if-no-files-found: error
          path: |
            app/dist/*.exe
            app/dist/*.dmg
            app/dist/*.zip
            app/dist/*.AppImage
            app/dist/*.deb
            app/dist/*.blockmap
            app/dist/latest*.yml

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: installers-*
          merge-multiple: true

      - name: SHA256SUMS
        working-directory: assets
        run: |
          ls -la
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' | sort -z | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" assets/* \
            --repo "$GITHUB_REPOSITORY" --draft --title "PGet $TAG" --generate-notes \
            --notes "Checksums: see SHA256SUMS."

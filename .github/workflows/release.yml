# App release
# -----------
# Push a tag `vX.Y.Z` (matching app/package.json "version") to build installers
# for Windows / macOS / Linux and attach them, with SHA256SUMS, to a DRAFT
# GitHub Release. Review the draft, then press "Publish".
#
# Engines: scripts/fetch-engines.mjs downloads aria2c + yt-dlp into app/bin/<os>-<arch>/.
# On macOS / Linux it takes aria2 from our own patched build (see aria2.yml),
# selected by the repo variable ARIA2_RELEASE (default below). Env passed to it:
#   ARIA2_URL          tarball for the runner's native platform
#   ARIA2_URL_X64      tarball for x64   (macOS builds both architectures)
#   ARIA2_URL_ARM64    tarball for arm64
#   ARIA2_SHA256SUMS_URL  SHA256SUMS of that aria2 release, for verification
#
# Code signing: off unless the repo variable SIGNING_ENABLED=true. Secrets:
#   macOS (Developer ID + notarization, so Gatekeeper doesn't say "unidentified developer"):
#     CSC_LINK                     base64 of the "Developer ID Application" .p12 (cert + private key)
#     CSC_KEY_PASSWORD             password of that .p12
#     APPLE_ID                     Apple ID email of the developer account
#     APPLE_APP_SPECIFIC_PASSWORD  app-specific password from account.apple.com
#     APPLE_TEAM_ID                10-character Team ID
#   Windows (optional, independent of macOS): WIN_CSC_LINK (base64 .pfx), WIN_CSC_KEY_PASSWORD
# electron-builder signs PGet.app (incl. aria2c / yt-dlp in Resources/bin) with Hardened
# Runtime + app/build/entitlements.mac.plist; app/build/notarize.js (afterSign) notarizes + staples with retries.
# Without secrets the builds are unsigned and trigger SmartScreen / Gatekeeper warnings.
#
# Windows signing via SignPath Foundation (free for OSS): set the repo variable
# SIGNPATH_ORGANIZATION_ID and the secret SIGNPATH_API_TOKEN, see docs/CODE_SIGNING.md.
#
# Auto-update (electron-updater, GitHub provider): the app reads latest.yml (Windows NSIS),
# latest-mac.yml (macOS zip) and latest-linux.yml (AppImage) from the latest *published*
# release, so these files and the *.blockmap files must be attached to every release.
# Anything that changes an installer after electron-builder hashed it (SignPath signing,
# stapling the dmg) must be followed by app/build/update-info.mjs to fix sha512/size.

name: Release app

on:
  push:
    tags: ['v*']
  workflow_dispatch:   # dry run: builds and uploads workflow artifacts, no release

permissions:
  contents: read

env:
  ARIA2_RELEASE: ${{ vars.ARIA2_RELEASE || 'aria2-1.37.0-pget.1' }}

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            runner: windows-latest
            native: ''               # Windows uses myfreeer's prebuilt aria2 (fetch-engines default)
          - name: macos
            runner: macos-15         # arm64 runner; electron-builder builds x64 + arm64 (see app/package.json)
            native: macos-arm64
          - name: linux
            runner: ubuntu-24.04
            native: linux-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150   # Windows 簽章要等人工核准
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Check tag matches app version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          v=$(node -p "require('./app/package.json').version")
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match app/package.json version $v"; exit 1
          fi

      - name: Engine URLs
        if: matrix.name != 'windows'
        shell: bash
        run: |
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${ARIA2_RELEASE}"
          os=${{ matrix.name }}
          {
            echo "ARIA2_URL=${base}/aria2c-${{ matrix.native }}.tar.gz"
            echo "ARIA2_URL_X64=${base}/aria2c-${os}-x64.tar.gz"
            echo "ARIA2_URL_ARM64=${base}/aria2c-${os}-arm64.tar.gz"
            echo "ARIA2_SHA256SUMS_URL=${base}/SHA256SUMS"
          } >> "$GITHUB_ENV"

      - name: Fetch engines (aria2c, yt-dlp)
        run: node scripts/fetch-engines.mjs

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build installers
        working-directory: app
        shell: bash
        env:
          # --- Code signing (off unless vars.SIGNING_ENABLED == 'true') ---
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ vars.SIGNING_ENABLED == 'true' && 'true' || 'false' }}
          CSC_LINK: ${{ vars.SIGNING_ENABLED == 'true' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ vars.SIGNING_ENABLED == 'true' && secrets.CSC_KEY_PASSWORD || '' }}
          WIN_CSC_LINK: ${{ vars.SIGNING_ENABLED == 'true' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ vars.SIGNING_ENABLED == 'true' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ vars.SIGNING_ENABLED == 'true' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ vars.SIGNING_ENABLED == 'true' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ vars.SIGNING_ENABLED == 'true' && secrets.APPLE_TEAM_ID || '' }}
        # electron-builder 會把「空字串」的 CSC_LINK 當成路徑去讀（macOS 報 "app not a file"），
        # 所以沒設定的簽章變數要整個 unset，不能留空。
        run: |
          # CSC_LINK 是 Apple 的 Developer ID，不能拿去簽 Windows（沒有 WIN_CSC_LINK 時 electron-builder 會退回用 CSC_LINK）
          if [ "$RUNNER_OS" = "Windows" ]; then unset CSC_LINK CSC_KEY_PASSWORD; fi
          for v in CSC_LINK CSC_KEY_PASSWORD WIN_CSC_LINK WIN_CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v:-}" ]; then unset "$v"; fi
          done
          npx electron-builder --publish never

      - name: Verify macOS signature & notarization
        if: matrix.name == 'macos' && vars.SIGNING_ENABLED == 'true'
        working-directory: app/dist
        run: |
          for app in mac*/PGet.app; do
            echo "== $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            # stapler 會連 Apple 的 CloudKit，偶爾網路斷線（Error 68），重試幾次
            for i in 1 2 3 4 5; do xcrun stapler validate "$app" && break; [ $i = 5 ] && exit 1; sleep 15; done
            spctl --assess --type execute --verbose=4 "$app"
          done
          for dmg in *.dmg; do
            echo "== $dmg"
            codesign --verify --strict --verbose=2 "$dmg"
            for i in 1 2 3 4 5; do xcrun stapler validate "$dmg" && break; [ $i = 5 ] && exit 1; sleep 15; done
            spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"
          done

      # notarize-dmg.js 在 electron-builder 算完雜湊之後才 staple dmg，latest-mac.yml 裡 dmg 的雜湊會過期。
      # 自動更新用的是 zip（afterSign 已公證、之後沒再改過），這裡依實際檔案重算，dmg 的 blockmap 刪掉。
      - name: Refresh macOS update metadata
        if: matrix.name == 'macos'
        working-directory: app
        run: node build/update-info.mjs dist/latest-mac.yml

      # --- Windows 程式碼簽章（SignPath Foundation，見 docs/CODE_SIGNING.md）---
      # 只在推 tag 且設定了 repo 變數 SIGNPATH_ORGANIZATION_ID 時執行；沒設定就照舊產出未簽章的檔案。
      # 簽的是安裝版與免安裝版 exe；送出後要由 Approver 在 SignPath 網站手動核准，這一步會等核准完成。
      - name: Upload unsigned installers (for SignPath)
        id: unsigned
        if: matrix.name == 'windows' && github.ref_type == 'tag' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows
          if-no-files-found: error
          path: |
            app/dist/PGet-Setup-*.exe
            app/dist/PGet-Portable-*.exe

      - name: Sign installers (SignPath)
        if: steps.unsigned.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'pget' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG || 'installers' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 5400   # 等人工核准，最多 90 分鐘
          output-artifact-directory: app/dist/signed
          parameters: |
            version: ${{ toJSON(github.ref_name) }}

      - name: Use signed installers
        if: steps.unsigned.outcome == 'success'
        shell: bash
        working-directory: app/dist
        # 簽章後檔案內容變了：blockmap 直接刪掉（自動更新會改成完整下載），
        # latest.yml 依簽章後的安裝檔重新產生 sha512／size（自動更新會驗證這個雜湊）
        run: |
          ls -la signed
          cp -f signed/*.exe .
          rm -rf signed ./*.blockmap
          v=$(node -p "require('../package.json').version")
          node ../build/update-info.mjs latest.yml --create "PGet-Setup-${v}.exe"
          cat latest.yml

      - name: Check update metadata
        shell: bash
        working-directory: app/dist
        run: |
          case "${{ matrix.name }}" in
            windows) want=latest.yml ;;
            macos)   want=latest-mac.yml ;;
            linux)   want=latest-linux.yml ;;
          esac
          if [ ! -f "$want" ]; then echo "::error::$want is missing (auto-update needs it)"; ls -la; exit 1; fi
          cat "$want"

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          if-no-files-found: error
          path: |
            app/dist/*.exe
            app/dist/*.dmg
            app/dist/*.zip
            app/dist/*.AppImage
            app/dist/*.deb
            app/dist/*.blockmap
            app/dist/latest*.yml

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: installers-*
          merge-multiple: true

      - name: SHA256SUMS
        working-directory: assets
        run: |
          ls -la
          # 三個平台的更新資訊檔名稱不同（latest.yml／latest-mac.yml／latest-linux.yml），合併時不會互相覆蓋
          for f in latest.yml latest-mac.yml latest-linux.yml; do
            [ -f "$f" ] || { echo "::error::$f missing"; exit 1; }
          done
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' | sort -z | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" assets/* \
            --repo "$GITHUB_REPOSITORY" --draft --title "PGet $TAG" --generate-notes \
            --notes "Checksums: see SHA256SUMS. Code signing policy: https://pget.pg72.tw/code-signing/"

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="optionsTitle"></title>
  <link rel="icon" href="icons/icon-32.png">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/options.css">
</head>
<body>
  <main class="options">
    <header class="brand page-head">
      <img src="icons/icon.svg" alt="">
      <div>
        <h1 class="brand-name">PGet<span class="dot">.</span> <span class="muted" data-i18n="optionsHeading"></span></h1>
      </div>
    </header>

    <!-- Connection -->
    <section class="card section">
      <h2 data-i18n="optConnection"></h2>
      <div class="field">
        <div>
          <span id="status" class="status checking" data-i18n="statusChecking"></span>
          <p id="statusHint" class="desc muted"></p>
        </div>
        <div class="actions">
          <button id="pair" class="primary" data-i18n="popupPair"></button>
          <button id="forget" class="danger" data-i18n="optForget"></button>
        </div>
      </div>
    </section>

    <!-- Interception -->
    <section class="card section">
      <h2 data-i18n="optInterception"></h2>

      <label class="field" for="paused">
        <div>
          <span class="label" data-i18n="popupPauseLabel"></span>
          <p class="desc muted" data-i18n="optPauseDesc"></p>
        </div>
        <span class="switch"><input id="paused" type="checkbox" role="switch"><span></span></span>
      </label>

      <div class="field">
        <div>
          <label class="label" for="minSize" data-i18n="optMinSize"></label>
          <p class="desc muted" data-i18n="optMinSizeDesc"></p>
        </div>
        <div class="num">
          <input id="minSize" type="number" min="0" max="10240" step="0.5" inputmode="decimal">
          <span class="muted">MB</span>
        </div>
      </div>

      <div class="field column">
        <div>
          <label class="label" for="siteInput" data-i18n="optExcluded"></label>
          <p class="desc muted" data-i18n="optExcludedDesc"></p>
        </div>
        <form id="siteForm" class="site-form">
          <input id="siteInput" type="text" autocomplete="off" spellcheck="false" data-i18n-placeholder="optExcludedPlaceholder">
          <button type="submit" data-i18n="optAdd"></button>
        </form>
        <ul id="siteList" class="site-list"></ul>
        <p id="siteEmpty" class="desc muted" data-i18n="optExcludedEmpty"></p>
      </div>

      <label class="field" for="sendCookies">
        <div>
          <span class="label" data-i18n="optSendCookies"></span>
          <p class="desc muted" data-i18n="optSendCookiesDesc"></p>
          <p class="desc muted" data-i18n="optSendCookiesPermission"></p>
        </div>
        <span class="switch"><input id="sendCookies" type="checkbox" role="switch"><span></span></span>
      </label>
    </section>

    <!-- Appearance & notifications -->
    <section class="card section">
      <h2 data-i18n="optAppearance"></h2>

      <label class="field" for="notify">
        <div>
          <span class="label" data-i18n="optNotify"></span>
          <p class="desc muted" data-i18n="optNotifyDesc"></p>
        </div>
        <span class="switch"><input id="notify" type="checkbox" role="switch"><span></span></span>
      </label>

      <div class="field">
        <div>
          <span class="label" id="themeLabel" data-i18n="optTheme"></span>
        </div>
        <div class="segmented" role="radiogroup" aria-labelledby="themeLabel">
          <label><input type="radio" name="theme" value="system"><span data-i18n="optThemeSystem"></span></label>
          <label><input type="radio" name="theme" value="light"><span data-i18n="optThemeLight"></span></label>
          <label><input type="radio" name="theme" value="dark"><span data-i18n="optThemeDark"></span></label>
        </div>
      </div>

      <div class="field">
        <div>
          <label class="label" for="language" data-i18n="optLanguage"></label>
          <p class="desc muted" data-i18n="optLanguageDesc"></p>
        </div>
        <select id="language">
          <option value="auto" data-i18n="optLanguageAuto"></option>
          <option value="zh_TW" lang="zh-TW">繁體中文</option>
          <option value="en" lang="en">English</option>
          <option value="zh_CN" lang="zh-CN">简体中文</option>
          <option value="ja" lang="ja">日本語</option>
          <option value="ko" lang="ko">한국어</option>
        </select>
      </div>
    </section>

    <section class="card section about">
      <h2 data-i18n="optAbout"></h2>
      <p class="desc" data-i18n="optPrivacyNote"></p>
      <p class="links">
        <a href="https://pget.pg72.tw" target="_blank" rel="noopener" data-i18n="popupWebsite"></a>
        <a href="https://pget.pg72.tw/privacy/" target="_blank" rel="noopener" data-i18n="optPrivacyLink"></a>
        <span id="extVersion" class="muted"></span>
      </p>
    </section>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
